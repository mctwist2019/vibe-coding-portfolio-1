name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # 진행 중인 Pages 배포는 중단하지 않음 (중단되면 다음 배포가 막힐 수 있음)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run golf-score unit tests
        run: cd golf-score && node --test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true # 저장소에 Pages가 아직 켜져 있지 않으면 첫 실행에서 켬 (Source: GitHub Actions)
      # 코스 폴더(golf-score/courses)의 코스 파일로 목록(index.json)을 만든다: 폴더에 파일을 넣기만 하면 앱의 "골프장 받기"에 나온다
      - name: Build the course list
        run: node golf-score/tools/build-course-index.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
